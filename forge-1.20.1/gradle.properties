# ---------------------------------------------------------------------------------------------------------------
# Type 95 Addition - an unofficial addon for Type 95 Sniper Rifle (Forge 1.20.1; the same jar runs on NeoForge 1.20.1)
# ---------------------------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Forge 1.20.1 (Type 95 and Rimulib need Forge 47.1 or newer). The same versions as The Shooting Star
# Addition's forge-1.20.1 branch.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=1.20.1-47.4.10
# Only for ./gradlew -Pneoforge (testing on NeoForge 1.20.1).
neoforge_version=1.20.1-47.1.106
forge_version_range=[47.1,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# This addon
mod_id=type95_addition
mod_version=1.2.0+forge-1.20.1
maven_group=dev.type95addition
