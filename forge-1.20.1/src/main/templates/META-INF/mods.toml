modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "All Rights Reserved"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Type 95 Addition"
logoFile = "type95_addition_icon.png"
logoBlur = false
description = '''
An unofficial addon for the Type 95 Sniper Rifle. Adds a second ammo type, the Lightning Formula: press R with the rifle to switch, hold right click and lightning gathers around the gun in four stages, let go and a lightning strike comes down where you aim. Power up to 20x (twice the original's top), damage, bolts, fire, scorched ground, the crater, colours and effects are all adjustable (J with the rifle in hand), with server limits in config/type95_addition-server.json.
'''

# "forge" on both loaders: NeoForge 1.20.1 kept Forge's mod id
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tanya_demo"
mandatory = true
versionRange = "[1.0.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "rimulib"
mandatory = true
versionRange = "[1.1.1,)"
ordering = "AFTER"
side = "BOTH"
